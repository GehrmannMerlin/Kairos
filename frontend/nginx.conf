server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html 每次 revalidate：保证用户访问 app.kairos.ac.cn 能拿到最新 Web bundle，
    # 避免旧 JS 长期驻留浏览器（修复后必须让用户看到新版本）。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA history fallback（内部重定向到 /index.html，复用上面的 no-cache 策略）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # content-hashed 静态资源：长缓存 immutable，不破坏指纹失效机制。
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
