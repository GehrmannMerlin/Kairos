# kairos-staging TLS vhost — bind-mounted into the shared Lumina nginx container
# (same pattern as aurora/stellaris). Serves:
#   staging.kairos.ac.cn             -> web (static SPA) + /api -> api + /api/events SSE
# TLS cert from host certbot at /etc/letsencrypt/live/staging.kairos.ac.cn/
#
# NOTE: this file is bind-mounted by the shared nginx container. Upstreams are
# resolved via Docker DNS (resolver 127.0.0.11) on the lumina-prod-internal
# network, where kairos-api / kairos-web containers are attached.

server {
    listen 80;
    listen [::]:80;
    server_name staging.kairos.ac.cn;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://staging.kairos.ac.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.kairos.ac.cn;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/staging.kairos.ac.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.kairos.ac.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KairosStagingTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/events/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kairos_api http://kairos-api:8000;
        proxy_pass $kairos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off; # SSE event stream
    }
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kairos_api http://kairos-api:8000;
        proxy_pass $kairos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Plan 生命周期后端上限 105s；反代留出传输余量，前端以服务器事实 reconcile。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kairos_web http://kairos-web:80;
        proxy_pass $kairos_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
