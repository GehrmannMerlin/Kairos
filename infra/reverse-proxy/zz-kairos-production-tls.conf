# Kairos production TLS vhost 模板 —— M-18 发布时启用（当前不部署）。
# 基于 staging vhost（zz-kairos-staging-tls.conf）替换为 app.kairos.ac.cn，
# 保留安全响应头与 SSE 反代配置；production 增加 HSTS（仅 HTTPS 满足后启用）。
# 由共享 Lumina nginx 以 bind mount 方式加载（同 aurora/stellaris/kairos-staging 模式）。

server {
    listen 80;
    listen [::]:80;
    server_name app.kairos.ac.cn;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://app.kairos.ac.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.kairos.ac.cn;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/app.kairos.ac.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.kairos.ac.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KairosProdTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/events/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kairos_api http://kairos-production-api-1:8000;
        proxy_pass $kairos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off; # SSE event stream
    }
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kairos_api http://kairos-production-api-1:8000;
        proxy_pass $kairos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kairos_web http://kairos-production-web-1:80;
        proxy_pass $kairos_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
