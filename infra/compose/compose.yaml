# Kairos 本地开发 docker compose
#
# 用法（在仓库根目录）:
#   cp .env.example .env
#   docker compose -f infra/compose/compose.yaml up -d --build
#
# 仅本地开发使用；Staging/Production 使用独立 compose（后续模块）。
name: kairos

x-backend-env: &backend-env
  KAIROS_ENV: dev
  KAIROS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kairos}:${POSTGRES_PASSWORD:-kairos_dev_password}@postgres:5432/${POSTGRES_DB:-kairos}
  KAIROS_TEMPORAL_ADDRESS: temporal:7233
  KAIROS_TEMPORAL_NAMESPACE: default
  KAIROS_S3_ENDPOINT: minio:9000
  KAIROS_S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-kairos_minio}
  KAIROS_S3_SECRET_KEY: ${MINIO_SECRET_KEY:-kairos_minio_secret}
  KAIROS_S3_BUCKET: kairos-dev
  KAIROS_S3_SECURE: "false"
  KAIROS_OTEL_ENABLED: "true"
  KAIROS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  KAIROS_CORS_ORIGINS: '["http://localhost:5173"]'
  # Forwarded from root .env; required for the credential vault (M-03) so the
  # API can store/read ModelConfig credentials during local development.
  KAIROS_CREDENTIAL_MASTER_KEY: ${KAIROS_CREDENTIAL_MASTER_KEY}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairos_dev_password}
    # Host 5434: local PostgreSQL holds 5432, another project's container holds 5433.
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kairos} -d ${POSTGRES_DB:-kairos}"]
      interval: 5s
      timeout: 5s
      retries: 12

  temporal:
    image: temporalio/auto-setup:1.26.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-kairos_dev_password}
      POSTGRES_SEEDS: postgres
    # Host port 8233: Windows excludes the 7178-7277 range (Hyper-V/WSL),
    # so 7233 cannot be bound on this machine.
    ports:
      - "8233:7233"
    healthcheck:
      # The server binds the container IP, not 127.0.0.1.
      test: ["CMD-SHELL", "temporal operator cluster health --address $(hostname -i):7233 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  temporal-ui:
    image: temporalio/ui:2.43.3
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:5173
    ports:
      - "${TEMPORAL_UI_PORT:-8088}:8080"
    depends_on:
      temporal:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-kairos_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-kairos_minio_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-kairos_minio} ${MINIO_SECRET_KEY:-kairos_minio_secret};
      mc mb --ignore-existing local/kairos-dev;
      exit 0;
      "

  otel-collector:
    # Core image is enough for OTLP receiver + debug exporter.
    # 0.116.0 layers were corrupt in our mirror (missing dynamic linker); 0.105.0 works.
    image: otel/opentelemetry-collector:0.105.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_PORT:-4317}:4317"
      - "4318:4318"
      - "8889:8889"

  migrate:
    build:
      context: ../../backend
    environment: *backend-env
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../../backend
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live')\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  worker:
    build:
      context: ../../backend
    environment: *backend-env
    command: ["python", "-m", "app.worker"]
    depends_on:
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../../frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
