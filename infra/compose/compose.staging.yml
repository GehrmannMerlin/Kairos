# Kairos staging compose — staging environment overrides.
#
# Applies on top of compose.base.yml:
#   docker compose -f compose.base.yml -f compose.staging.yml up -d
#
# DEPLOY-GATE-1 specifics for the shared production host 47.238.145.24:
#   - project name kairos-staging (isolated from lumina/stellaris/aurora projects).
#   - web/api join the shared `lumina-prod-internal` network so the existing
#     shared nginx can reach them via Docker DNS (kairos-web:80 / kairos-api:8000).
#   - container_name fixed so the shared nginx upstream names are stable.
#   - secrets injected from /srv/kairos/env/staging.env (600, never in Git).
name: kairos-staging

x-staging-env-file: &staging-env-file
  env_file:
    - ${KAIROS_STAGING_ENV_FILE:-/srv/kairos/env/staging.env}

# M-16：Staging 安全小限额（D-071 部署配置，不进 CollectionSpec）。
# worker 用同一镜像 + KAIROS_WORKER_ROLES=all（单进程 poll 全部 role queue，
# 每 queue 并发来自 CapacityConfig）；未来扩 worker 时改为多容器不同 role 即可。
x-m16-capacity: &m16-capacity
  KAIROS_WORKER_ROLES: "all"
  KAIROS_CAPACITY_GLOBAL_ACTIVE_TASKS: "4"
  KAIROS_CAPACITY_PER_USER_ACTIVE_TASKS: "2"
  KAIROS_CAPACITY_CORE_CONCURRENCY: "2"
  KAIROS_CAPACITY_HTTP_CONCURRENCY: "2"
  KAIROS_CAPACITY_BROWSER_CONCURRENCY: "1"
  KAIROS_CAPACITY_LLM_SEARCH_CONCURRENCY: "1"
  KAIROS_CAPACITY_LEASE_TTL_SECONDS: "60"
  KAIROS_CAPACITY_LEASE_HEARTBEAT_SECONDS: "15"
  KAIROS_CAPACITY_LEASE_REAP_INTERVAL_SECONDS: "20"
  KAIROS_CAPACITY_DOMAIN_BREAKER_THRESHOLD: "3"
  KAIROS_CAPACITY_DOMAIN_BREAKER_COOLDOWN_SECONDS: "30"

services:
  postgres:
    <<: *staging-env-file

  temporal:
    <<: *staging-env-file

  minio:
    <<: *staging-env-file

  migrate:
    <<: *staging-env-file

  api:
    <<: *staging-env-file
    container_name: kairos-api
    environment:
      KAIROS_PROVIDER_INFERENCE_TIMEOUT_SECONDS: "45"
      KAIROS_PLAN_LIFECYCLE_TIMEOUT_SECONDS: "105"
    networks:
      - default
      - edge

  worker:
    <<: *staging-env-file
    environment:
      <<: *m16-capacity
      KAIROS_PROVIDER_INFERENCE_TIMEOUT_SECONDS: "45"
      KAIROS_PLAN_LIFECYCLE_TIMEOUT_SECONDS: "105"

  web:
    <<: *staging-env-file
    container_name: kairos-web
    networks:
      - default
      - edge

networks:
  default:
    name: kairos-staging-internal
  edge:
    name: lumina-prod-internal
    external: true
