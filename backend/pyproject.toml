[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-backend"
version = "0.1.0"
description = "Kairos web collection agent backend (FastAPI + Temporal)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "temporalio>=1.3",
    "minio>=7.2",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
    # Pinned exact: the instrumentation line ships with a `b0` suffix in its
    # version (e.g. 0.65b0) which older pip rejects as a pre-release under >=.
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-exporter-otlp>=1.27",
    "httpx>=0.27",
    "pwdlib[argon2]>=0.2",
    "cryptography>=42",
    # M-06 Goal Understanding. We only use pydantic-ai's typed Agent/FunctionModel
    # orchestration; the actual model call routes through app.providers (M-03),
    # never through pydantic-ai's own provider SDKs.
    "pydantic-ai>=2.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: requires live local services (postgres/temporal/minio)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false
no_implicit_optional = true
files = ["app", "scripts", "tests"]
